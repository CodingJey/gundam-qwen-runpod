# Runs inside the Runpod container. The Runpod HTTP proxy terminates HTTPS and
# forwards to this nginx on port 8188. nginx adds HTTP Basic auth and proxies
# websockets to ComfyUI on loopback port 8189.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8188;
    server_name _;

    server_tokens off;
    client_max_body_size 200M;

    # Unauthenticated readiness endpoint. It only succeeds once ComfyUI is up.
    location = /healthz {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:8189/system_stats;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        auth_basic "Gundam Qwen-Image";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8189;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Image-generation requests can run for minutes. Runpod's Cloudflare
        # proxy has its own 100-second HTTP timeout, but ComfyUI's prompt API
        # returns immediately and progress is streamed over websockets.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
